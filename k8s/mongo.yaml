apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi-mongo
  namespace: default
  labels:
    app: unifi-mongo
  annotations:
    argocd.argoproj.io/tracking-id: unifi-controller:apps/Deployment:default/unifi-mongo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: unifi-mongo
  template:
    metadata:
      labels:
        app: unifi-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7.0.40
          imagePullPolicy: IfNotPresent
          args:
            - --bind_ip_all
          ports:
            - name: mongo
              containerPort: 27017
          envFrom:
            - secretRef:
                name: unifi-mongo-auth
          env:
            - name: MONGO_INITDB_DATABASE
              value: admin
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: init
              mountPath: /docker-entrypoint-initdb.d/init-mongo.sh
              subPath: init-mongo.sh
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: unifi-mongo-pvc
        - name: init
          configMap:
            name: unifi-mongo-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: unifi-mongo
  namespace: default
  labels:
    app: unifi-mongo
  annotations:
    argocd.argoproj.io/tracking-id: unifi-controller:/Service:default/unifi-mongo
spec:
  type: ClusterIP
  selector:
    app: unifi-mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
