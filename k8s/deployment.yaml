apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi-controller
  namespace: default
  labels:
    app: unifi-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: unifi-controller
  template:
    metadata:
      labels:
        app: unifi-controller
    spec:
      initContainers:
        - name: wait-mongo
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z unifi-mongo 27017; do
                echo waiting-for-mongo
                sleep 2
              done
      containers:
        - name: unifi
          image: lscr.io/linuxserver/unifi-network-application:8.2.93
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
            - name: inform
              containerPort: 8080
            - name: stun
              containerPort: 3478
              protocol: UDP
            - name: discovery
              containerPort: 10001
              protocol: UDP
            - name: ssdp
              containerPort: 1900
              protocol: UDP
            - name: portal-https
              containerPort: 8843
            - name: portal-http
              containerPort: 8880
            - name: speedtest
              containerPort: 6789
            - name: syslog
              containerPort: 5514
              protocol: UDP
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Sao_Paulo
            - name: MONGO_HOST
              value: unifi-mongo
            - name: MONGO_PORT
              value: "27017"
            - name: MEM_LIMIT
              value: "1024"
            - name: MEM_STARTUP
              value: "1024"
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: unifi-mongo-auth
                  key: MONGO_USER
            - name: MONGO_PASS
              valueFrom:
                secretKeyRef:
                  name: unifi-mongo-auth
                  key: MONGO_PASS
            - name: MONGO_DBNAME
              valueFrom:
                secretKeyRef:
                  name: unifi-mongo-auth
                  key: MONGO_DBNAME
            - name: MONGO_AUTHSOURCE
              valueFrom:
                secretKeyRef:
                  name: unifi-mongo-auth
                  key: MONGO_AUTHSOURCE
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /
              port: 8443
              scheme: HTTPS
            periodSeconds: 10
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /
              port: 8443
              scheme: HTTPS
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8443
              scheme: HTTPS
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: unifi-config-pvc
