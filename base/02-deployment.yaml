apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi-controller
  labels:
    app: unifi-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unifi-controller
  template:
    metadata:
      labels:
        app: unifi-controller
    spec:
      containers:
        - name: unifi-controller
          image: lscr.io/linuxserver/unifi-network-application:latest
          ports:
            - name: https
              containerPort: 8443
            - name: inform
              containerPort: 8080
            - name: stun
              containerPort: 3478
              protocol: UDP
          env:
            - name: MONGO_HOST
              value: "localhost"
            - name: MONGO_PORT
              value: "27017"
            - name: MONGO_DBNAME
              value: "unifi"
            - name: MONGO_USER
              value: "unifi"
            - name: MONGO_PASS
              value: "unifi123"
          volumeMounts:
            - name: unifi-data
              mountPath: /config
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 60
            periodSeconds: 15

        - name: mongodb
          image: mongo:4.4
          args: ["--dbpath", "/data/db"]
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: "unifi"
            - name: MONGO_INITDB_ROOT_PASSWORD
              value: "unifi123"
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db

      volumes:
        - name: unifi-data
          persistentVolumeClaim:
            claimName: unifi-data
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongo-data
